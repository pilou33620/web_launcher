name: bancs d'essai

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  essais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # l'historique d'Andy est repris d'un ancien commit

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # comptes, sessions, Andy, Temp, relais (WebSocket, flux), outils lancés, terminal, mises à jour (dépôts git locaux)
      - name: Launcher (Rust)
        run: |
          git config --global init.defaultBranch main
          cargo test --release -p launcher --locked

      # la page : chaque script doit au moins se lire
      - name: Interface (syntaxe)
        run: for f in $(find web -name '*.js'); do node --check "$f" || exit 1; done

      - name: Scripts shell (syntaxe)
        run: for f in demarrer_WEB_LAUNCHER.sh lancer.sh scripts/binaires.sh installer.sh; do sh -n "$f" || exit 1; done
